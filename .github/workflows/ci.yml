name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the adapter and dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: python -m pytest -q

  js:
    name: js (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Node tests
        run: node --test tests_js/*.test.mjs

      - name: Typecheck
        run: npm run typecheck

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        shell: bash
        run: |
          shopt -s nullglob
          files=(*.sh scripts/*.sh bin/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::no shell scripts found, skipping shellcheck"
            exit 0
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck "${files[@]}"

  e2e:
    name: e2e (RAPTOR v3.1.0)
    runs-on: ubuntu-latest
    needs: [python, js]
    timeout-minutes: 15
    env:
      RAPTOR_HOME: ${{ github.workspace }}/.raptor
      SANDBOX_HOME: ${{ github.workspace }}/.sandbox/home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the adapter
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Clone RAPTOR at the pinned tag
        run: git clone --depth 1 --branch v3.1.0 https://github.com/gadievron/raptor.git "$RAPTOR_HOME"

      - name: Generate the OpenCode tree
        run: raptor-opencode generate --raptor-home "$RAPTOR_HOME" --out-dir "$SANDBOX_HOME/generate"

      - name: Install into a throwaway HOME
        run: |
          mkdir -p "$SANDBOX_HOME"
          HOME="$SANDBOX_HOME" \
          XDG_CONFIG_HOME="$SANDBOX_HOME/.config" \
          XDG_DATA_HOME="$SANDBOX_HOME/.local/share" \
            raptor-opencode install --yes --skip-deps --merge-config --raptor-home "$RAPTOR_HOME"

      - name: Doctor
        run: |
          HOME="$SANDBOX_HOME" \
          XDG_CONFIG_HOME="$SANDBOX_HOME/.config" \
          XDG_DATA_HOME="$SANDBOX_HOME/.local/share" \
            raptor-opencode doctor --raptor-home "$RAPTOR_HOME" --json

      - name: Guard smoke (allowed + blocked)
        run: |
          node --experimental-strip-types scripts/guard-smoke.mjs \
            "$SANDBOX_HOME/.local/share/raptor-opencode/generated"

      - name: Uninstall leaves no links behind
        run: |
          HOME="$SANDBOX_HOME" \
          XDG_CONFIG_HOME="$SANDBOX_HOME/.config" \
          XDG_DATA_HOME="$SANDBOX_HOME/.local/share" \
            raptor-opencode uninstall
          test ! -e "$SANDBOX_HOME/.local/share/raptor-opencode/install-manifest.json"
