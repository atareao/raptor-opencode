# git-cliff configuration for raptor-opencode.
#
# The history mixes gitmoji and conventional-commit subjects, so every parser
# accepts both forms: the emoji (e.g. "✨ feat(scope): ...") and the plain
# conventional type (e.g. "feat(scope): ..."). Merge commits are skipped.
# This is a single-author project, so the contributors section is disabled.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
sort_commits = "oldest"

commit_parsers = [
  # Merge commits carry no user-facing information; their PR title is a
  # duplicate of the individual commits.
  { message = "^Merge (pull request|branch)", skip = true },

  # Breaking changes (gitmoji 💥 or conventional "type!:" / BREAKING CHANGE).
  { message = "^💥", group = "Breaking changes" },
  { message = "^[^\\n]*!:|(?m)^BREAKING CHANGE", group = "Breaking changes" },

  # Features
  { message = "^✨", group = "Features" },
  { message = "^feat(\\(.*\\))?!?:", group = "Features" },

  # Bug fixes
  { message = "^🐛", group = "Bug fixes" },
  { message = "^🚑", group = "Bug fixes" },
  { message = "^fix(\\(.*\\))?!?:", group = "Bug fixes" },

  # Documentation
  { message = "^📝", group = "Documentation" },
  { message = "^docs(\\(.*\\))?!?:", group = "Documentation" },

  # CI
  { message = "^👷", group = "CI" },
  { message = "^ci(\\(.*\\))?!?:", group = "CI" },

  # Tests
  { message = "^✅", group = "Tests" },
  { message = "^test(\\(.*\\))?!?:", group = "Tests" },

  # Performance
  { message = "^⚡", group = "Performance" },
  { message = "^perf(\\(.*\\))?!?:", group = "Performance" },

  # Refactoring
  { message = "^♻", group = "Refactoring" },
  { message = "^refactor(\\(.*\\))?!?:", group = "Refactoring" },

  # Styling
  { message = "^💄", group = "Styling" },
  { message = "^style(\\(.*\\))?!?:", group = "Styling" },

  # Dependencies
  { message = "^⬆", group = "Dependencies" },
  { message = "^deps(\\(.*\\))?!?:", group = "Dependencies" },

  # Reverts
  { message = "^⏪", group = "Reverts" },
  { message = "^revert(\\(.*\\))?!?:", group = "Reverts" },

  # Chores and anything else.
  { message = "^🔧", group = "Chores" },
  { message = "^chore(\\(.*\\))?!?:", group = "Chores" },
  { message = ".*", group = "Chores" },
]
